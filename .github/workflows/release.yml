name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../notion-cli-${{ matrix.target }}.tar.gz notion
          cd ../../..
          shasum -a 256 notion-cli-${{ matrix.target }}.tar.gz > notion-cli-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: notion-cli-${{ matrix.target }}
          path: |
            notion-cli-${{ matrix.target }}.tar.gz
            notion-cli-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            notion-cli-*.tar.gz
            notion-cli-*.tar.gz.sha256

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notion-cli-aarch64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: notion-cli-x86_64-apple-darwin

      - name: Get SHA256
        id: sha
        run: |
          echo "arm64=$(cat notion-cli-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86_64=$(cat notion-cli-x86_64-apple-darwin.tar.gz.sha256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: mimo-3/homebrew-tap
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ github.ref_name }}",
              "arm64_sha256": "${{ steps.sha.outputs.arm64 }}",
              "x86_64_sha256": "${{ steps.sha.outputs.x86_64 }}"
            }
