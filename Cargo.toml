[package]
name = "notion-cli"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
description = "A command-line interface for the Notion API"
license = "MIT"
repository = "https://github.com/mimo-3/notion-cli"
readme = "README.md"
keywords = ["notion", "cli", "api", "productivity"]
categories = ["command-line-utilities", "api-bindings"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "docs/comparison.png",
    "src/**",
]

[[bin]]
name = "notion"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
colored = "3"
csv = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
dialoguer = "0.11"
comfy-table = "7"
rand = "0.8"
open = "5"
base64 = "0.23"
urlencoding = "2"

[dev-dependencies]
wiremock = "=0.6.4"
